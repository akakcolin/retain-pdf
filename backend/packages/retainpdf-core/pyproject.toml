[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retainpdf-core"
version = "4.1.6"
description = "RetainPDF Python pipeline core"
requires-python = ">=3.10,<3.12"
dependencies = [
  "requests==2.32.5",
  "urllib3==2.5.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]
# Opt-in only; no production path needs fitz after the native render_rs port.
fitz = [
  "PyMuPDF==1.26.5",
]

[project.scripts]
retainpdf-run-translate-only = "entrypoints.console:run_translate_only"
retainpdf-validate-document-schema = "entrypoints.validate_document_schema:main"

[tool.setuptools]
package-dir = {"" = "../../scripts"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["../../scripts"]
include = [
  "entrypoints*",
  "foundation*",
  "runtime*",
  "services*",
]
exclude = [
  "devtools*",
]

[tool.setuptools.package-data]
"services.document_schema" = ["*.json"]
"foundation.prompts" = ["*.md", "*.txt"]
