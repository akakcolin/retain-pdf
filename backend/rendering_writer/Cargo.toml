[package]
name = "rendering_writer"
version = "0.1.0"
edition = "2021"

[dependencies]
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
rendering_core = { path = "../rendering_core" }
image = "0.25"
flate2 = "1"

[dev-dependencies]
base64 = "0.22"
rendering_reader = { path = "../rendering_reader" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
