[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "rendering-bridge"
version = "0.1.0"
description = "Native Rust backend for RetainPDF rendering (pyo3/maturin)"
requires-python = ">=3.10"

[tool.maturin]
module-name = "rendering_bridge"
manifest-path = "Cargo.toml"
