[project]
name = "retain-pdf-backend"
version = "4.1.0-beta8"
description = "Retain PDF backend pipeline dependencies and tooling"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyMuPDF==1.26.5",
  "requests==2.32.5",
  "urllib3==2.5.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]
# Desktop bundle only ships the Python HTTP stack (requests/urllib3);
# PyMuPDF (translation/OCR fitz usage) and the app runtime deps are pruned
# from the packaged app.
desktop = [
  "requests==2.32.5",
  "urllib3==2.5.0",
]

[tool.retain_pdf.external-binaries]
required = ["typst"]
optional = ["gs"]
