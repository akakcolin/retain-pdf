[project]
name = "retain-pdf-backend"
version = "4.1.0-beta8"
description = "Retain PDF backend pipeline dependencies and tooling"
requires-python = ">=3.11,<3.12"
dependencies = [
  "requests==2.32.5",
  "urllib3==2.5.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]
# PyMuPDF (AGPL-3.0) is no longer needed by any production path: the three
# former fitz call sites (preview render, upload repair, side-by-side) now run
# through the native `render_rs` binary. Kept as an opt-in extra only for the
# lazy-importing LLM domain-context helper (services/translation/llm/domain_context.py),
# which degrades gracefully when fitz is absent.
fitz = [
  "PyMuPDF==1.26.5",
]
# Desktop bundle ships the Python HTTP stack (no PyMuPDF).
desktop = [
  "requests==2.32.5",
  "urllib3==2.5.0",
]

[tool.retain_pdf.external-binaries]
required = ["typst"]
optional = ["gs"]
