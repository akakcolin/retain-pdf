[package]
name = "retainpdf-desktop"
version = "4.1.7"
description = "RetainPDF desktop wrapper (Tauri v2)"
edition = "2021"

[lib]
name = "retainpdf_app"
crate-type = ["lib"]

[[bin]]
name = "retainpdf-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
