name: Python Pipeline Tests

# Gate for the Python-side OCR/normalize/rendering-layout production suites that
# rendering-parity.yml does not cover (it only runs devtools/tests/rendering).
# Runs document_schema + text_layout + ai_service pytest on PR/main.

"on":
  pull_request:
    paths:
      - "backend/scripts/foundation/**"
      - "backend/scripts/services/document_schema/**"
      - "backend/scripts/services/ocr_provider/**"
      - "backend/scripts/services/mineru/**"
      - "backend/scripts/services/network/**"
      - "backend/scripts/services/pipeline_shared/**"
      - "backend/scripts/services/rendering/layout/**"
      - "backend/scripts/services/translation/core/ocr/**"
      - "backend/scripts/services/translation/services/policy/**"
      - "backend/ai_service/**"
      - "backend/rust_api/src/routes/ai_proxy.rs"
      - "backend/scripts/devtools/tests/document_schema/**"
      - "backend/scripts/devtools/tests/text_layout/**"
      - ".github/workflows/python-pipeline-tests.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "backend/scripts/foundation/**"
      - "backend/scripts/services/document_schema/**"
      - "backend/scripts/services/ocr_provider/**"
      - "backend/scripts/services/mineru/**"
      - "backend/scripts/services/network/**"
      - "backend/scripts/services/pipeline_shared/**"
      - "backend/scripts/services/rendering/layout/**"
      - "backend/scripts/services/translation/core/ocr/**"
      - "backend/scripts/services/translation/services/policy/**"
      - "backend/ai_service/**"
      - "backend/rust_api/src/routes/ai_proxy.rs"
      - "backend/scripts/devtools/tests/document_schema/**"
      - "backend/scripts/devtools/tests/text_layout/**"
      - ".github/workflows/python-pipeline-tests.yml"

jobs:
  python-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docker/requirements-test.txt
          python -m pip install fastapi pydantic httpx uvicorn

      - name: Run document_schema + text_layout suites
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend/scripts"
          cd backend/scripts
          python -m pytest devtools/tests/document_schema/ devtools/tests/text_layout/ -q

      - name: Run ai_service suite
        shell: bash
        run: |
          python -m pytest "$GITHUB_WORKSPACE/backend/ai_service/tests" -q
