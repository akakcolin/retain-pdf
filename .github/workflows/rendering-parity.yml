name: Rendering Parity

# Differential parity gate for the Rust-ified rendering crates (doc 15 D2).
# Replays the embedded corpora through the native replay tests so a Rust
# change that diverges the golden corpora fails here instead of in a release.
# The D5 target-metric gate runs the committed baseline against the
# target-state sample; live /metrics 对照 runs operationally via
# `devtools/d5_baseline.py check --base-url <api>`.

"on":
  pull_request:
    paths:
      - "backend/rendering_core/**"
      - "backend/rendering_reader/**"
      - "backend/rendering_writer/**"
      - "backend/rendering_orchestrator/**"
      - "resources/samples/golden-pdfs/**"
      - ".github/workflows/rendering-parity.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "backend/rendering_core/**"
      - "backend/rendering_reader/**"
      - "backend/rendering_writer/**"
      - "backend/rendering_orchestrator/**"
      - "resources/samples/golden-pdfs/**"
      - ".github/workflows/rendering-parity.yml"

jobs:
  differential-replay:
    name: Cargo differential replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mupdf-sys build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config

      - name: Writer differential replay
        run: cargo test --manifest-path backend/rendering_writer/Cargo.toml

      - name: Reader differential replay
        run: cargo test --manifest-path backend/rendering_reader/Cargo.toml

      - name: Orchestrator bridge-contract gate
        run: cargo test --manifest-path backend/rendering_orchestrator/Cargo.toml

  d5-metric-baseline:
    name: D5 metric baseline check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: D5 metric baseline check
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend/scripts"
          cd backend/scripts
          python devtools/d5_baseline.py check \
            --baseline devtools/d5_baseline.json \
            --metrics-file devtools/tests/d5_baseline/fixtures/d5_metrics_sample.txt \
            --desktop-manifest "$GITHUB_WORKSPACE/desktop/app/backend/bundle-manifest.json"
